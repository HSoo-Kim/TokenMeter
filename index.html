<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TokenMeter</title>
<style>
  :root {
    --bg: #15161c; --card: #1d1f28; --card-hi: #23262f; --line: #2b2e3b; --track: #2c2f3d;
    --fg: #eef0f6; --mute: #8d92a6; --dim: #5d6273;
    --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
    --codex: #a5b4fc; --claude: #e8916f; --lbl: #ffb04a;
    --shadow: 0 24px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --card: #f5f6f9; --card-hi: #eaecf2; --line: #e1e4ec; --track: #e3e5ec;
    --fg: #15161c; --mute: #6b7085; --dim: #979bad;
    --ok: #0ea472; --warn: #d97706; --bad: #dc3d3d;
    --codex: #4f5fd6; --claude: #c2653f; --lbl: #d97a00;
    --shadow: 0 24px 64px rgba(20,22,40,.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; }
  body {
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    color: var(--fg); -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden;
  }
  .shell { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  header { display: flex; align-items: center; gap: 6px; padding: 14px 12px 10px 18px; }
  header h1 { flex: 1; font-size: 14px; font-weight: 650; letter-spacing: .1px; }
  header h1 span { color: var(--mute); font-weight: 400; font-size: 11.5px; margin-left: 8px; }
  .ib {
    width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--mute);
    display: grid; place-items: center; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .ib:hover { background: var(--card-hi); color: var(--fg); }
  #lang { width: auto; padding: 0 5px 0 7px; gap: 1px; grid-auto-flow: column; font-size: 11px; font-weight: 700; letter-spacing: .3px; }
  #lang .caret { width: 11px; height: 11px; stroke-width: 2.4; opacity: .75; }
  .ib.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .list { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px; cursor: grab; }
  .card.drag {
    cursor: grabbing; position: relative; z-index: 5; border-color: color-mix(in srgb, var(--codex) 55%, var(--line));
    box-shadow: 0 12px 28px rgba(0,0,0,.35); transition: none;
  }
  .list.dragging .card:not(.drag) { opacity: .72; }
  .top { display: flex; align-items: center; gap: 10px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 11.5px; letter-spacing: .3px; flex: none; }
  .mark.codex { background: color-mix(in srgb, var(--codex) 14%, transparent); color: var(--codex); }
  .mark.claude { background: color-mix(in srgb, var(--claude) 14%, transparent); color: var(--claude); }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--mute); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: var(--card-hi); color: var(--mute); text-transform: uppercase; letter-spacing: .5px; flex: none; }

  .wins { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .win { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .lbl { color: var(--fg); font-weight: 600; font-size: 12px; min-width: 52px; }
  .bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--c); transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .val { text-align: right; line-height: 1.15; white-space: nowrap; }
  .val b { font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--c); }
  .val b::after { content: " " attr(data-left); font-size: 10.5px; font-weight: 500; color: var(--mute); }
  .val small { display: block; color: var(--lbl); font-weight: 600; font-size: 11px; font-variant-numeric: tabular-nums; }

  .note { margin-top: 8px; font-size: 11px; color: var(--warn); display: flex; gap: 6px; align-items: center; }
  .note.err { color: var(--bad); }
  .empty { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; color: var(--mute); font-size: 12px; }
  .btn { border: 1px solid var(--line); background: var(--card-hi); color: var(--fg); border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }

  footer { display: flex; justify-content: space-between; align-items: center; padding: 0 18px 12px; color: var(--dim); font-size: 11px; }
  kbd {
    font: inherit; font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--card-hi); color: var(--mute);
    border: 1px solid var(--line); cursor: pointer;
  }
  kbd:hover { color: var(--fg); }
  kbd.rec { color: var(--fg); border-color: var(--codex); animation: pulse 1s ease-in-out infinite; }
  kbd.err { color: var(--bad); border-color: var(--bad); }
  @keyframes pulse { 50% { opacity: .5; } }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>TokenMeter <span id="sub"></span></h1>
    <button class="ib" id="lang" title="Language"><span id="langMark"></span><svg class="caret" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
    <button class="ib" id="theme" title="Theme"></button>
    <button class="ib" id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" id="refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
    <button class="ib" id="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="list" id="list"></div>
  <footer><span id="updated"></span><span><kbd id="hotkey"></kbd> <span id="hotkeyLabel"></span></span></footer>
</div>
<script>
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const color = left => left > 50 ? 'var(--ok)' : left > 20 ? 'var(--warn)' : 'var(--bad)';
  const until = ms => {
    const s = Math.max(0, (ms - Date.now()) / 1000);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d ? `${d}${T.d} ${h}${T.h}` : h ? `${h}${T.h} ${m}${T.m}` : `${m}${T.m}`;
  };
  const PROVIDER = { codex: ['GPT', 'Codex'], claude: ['CL', 'Claude'] };
  const LANGS = ['en', 'zh', 'ko'];
  const I18N = {
    en: { langMark: 'EN', connected: n => `${n} connected`, loading: 'Loading…', updated: t => `Updated ${t}`,
      left: 'left', resetsIn: d => `resets in ${d}`, noUsage: 'No usage data', loginRequired: 'Login required', login: 'Log in',
      openClose: 'open / close', hotkeyHint: 'Click, then press a new combo', pressCombo: 'Press a combo…', needMod: 'Needs Ctrl / Alt / Shift',
      themeTitle: 'Theme', addTitle: 'Add account', refreshTitle: 'Refresh', closeTitle: 'Close (Esc)', menuTitle: 'Account menu',
      d: 'd', h: 'h', m: 'm', locale: 'en-US' },
    zh: { langMark: '中', connected: n => `已连接 ${n}`, loading: '加载中…', updated: t => `更新于 ${t}`,
      left: '剩余', resetsIn: d => `${d}后重置`, noUsage: '暂无用量数据', loginRequired: '需要登录', login: '登录',
      openClose: '打开/关闭', hotkeyHint: '点击后按下新的组合键', pressCombo: '请按组合键…', needMod: '需含 Ctrl / Alt / Shift',
      themeTitle: '主题', addTitle: '添加账号', refreshTitle: '刷新', closeTitle: '关闭 (Esc)', menuTitle: '账号菜单',
      d: '天', h: '小时', m: '分', locale: 'zh-CN' },
    ko: { langMark: '한', connected: n => `${n} 연결됨`, loading: '불러오는 중…', updated: t => `업데이트 ${t}`,
      left: '남음', resetsIn: d => `${d} 후 초기화`, noUsage: '사용량 정보 없음', loginRequired: '로그인 필요', login: '로그인',
      openClose: '열기/닫기', hotkeyHint: '클릭 후 새 키 조합 입력', pressCombo: '키 조합 입력…', needMod: 'Ctrl / Alt / Shift 포함 필요',
      themeTitle: '테마', addTitle: '계정 추가', refreshTitle: '새로고침', closeTitle: '닫기 (Esc)', menuTitle: '계정 메뉴',
      d: '일', h: '시간', m: '분', locale: 'ko-KR' },
  };
  let T = I18N.en;
  const ICON = {
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  };

  let data = [], theme = 'dark', lang = 'en', hotkey = 'Ctrl+Alt+U';
  function card(a) {
    const [mark, pname] = PROVIDER[a.type] || ['?', a.type];
    const head = `<div class="top">
        <div class="mark ${a.type}">${mark}</div>
        <div class="who"><div class="name">${esc(a.name || a.id)}</div><div class="meta">${esc(pname)}${a.name ? ' · ' + esc(a.id) : ''}</div></div>
        ${a.plan ? `<span class="badge">${esc(a.plan)}</span>` : ''}
        <button class="ib" data-menu="${esc(a.id)}" title="${esc(T.menuTitle)}"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </div>`;
    if (!a.loggedIn) {
      return `<div class="card" data-id="${esc(a.id)}">${head}<div class="empty"><span>${esc(a.error || T.loginRequired)}</span><button class="btn" data-menu="${esc(a.id)}">${esc(T.login)}</button></div></div>`;
    }
    const wins = (a.windows || []).map(w => {
      const left = Math.max(0, Math.min(100, 100 - w.usedPct));
      return `<div class="win" style="--c:${color(left)}"><span class="lbl">${esc(w.label)}</span>
        <div class="bar"><i style="width:${left}%"></i></div>
        <div class="val"><b data-left="${esc(T.left)}">${Math.round(left)}%</b><small>${esc(T.resetsIn(until(w.resetsAt)))}</small></div></div>`;
    }).join('') || (a.error ? '' : `<div class="empty"><span>${esc(T.noUsage)}</span></div>`);
    const note = a.error ? `<div class="note ${a.soft ? '' : 'err'}">${esc(a.error)}</div>` : '';
    return `<div class="card" data-id="${esc(a.id)}">${head}<div class="wins">${wins}</div>${note}</div>`;
  }
  function render() {
    if (drag) return;                            // never rebuild the list while a card is held
    $('#list').innerHTML = data.map(card).join('');
    const ts = Math.max(0, ...data.map(a => a.updatedAt || 0));
    $('#updated').textContent = ts ? T.updated(new Date(ts).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' })) : T.loading;
    $('#sub').textContent = T.connected(`${data.filter(a => a.loggedIn).length}/${data.length}`);
    requestAnimationFrame(() => api.resize(document.querySelector('.shell').getBoundingClientRect().height + 2));
  }
  function applyTheme(t) {
    theme = t; document.documentElement.dataset.theme = t;
    $('#theme').innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
    $('#theme').title = T.themeTitle;
  }
  function applyLang(l) {
    lang = LANGS.includes(l) ? l : 'en';
    T = I18N[lang];
    document.documentElement.lang = lang;
    $('#langMark').textContent = T.langMark;
    $('#hotkeyLabel').textContent = T.openClose;
    hk.title = T.hotkeyHint;
    $('#add').title = T.addTitle; $('#refresh').title = T.refreshTitle; $('#close').title = T.closeTitle;
  }
  api.onState(s => {
    data = s.list; hotkey = s.hotkey; applyLang(s.lang); applyTheme(s.theme || 'dark');
    if (!recording) hk.textContent = hotkey;
    $('#refresh').classList.remove('spin'); render();
  });
  setInterval(render, 30000);

  $('#theme').onclick = () => api.setTheme(theme === 'dark' ? 'light' : 'dark');
  $('#lang').onclick = () => api.langMenu();
  $('#refresh').onclick = () => { $('#refresh').classList.add('spin'); api.refresh(); };
  $('#add').onclick = () => api.addMenu();
  $('#close').onclick = () => api.hide();
  $('#list').addEventListener('click', e => {
    if (dragged) return;                       // the pointerup that ended a drag must not open a menu
    const b = e.target.closest('[data-menu]');
    if (b) api.menu(b.dataset.menu);
  });

  // ---- drag a card to reorder: the card moves in the DOM as you pass a neighbour's midpoint ----
  const list = $('#list');
  let drag = null, dragged = false;
  const cardOrder = () => [...list.children].map(c => c.dataset.id);

  list.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    const card = e.target.closest('.card');
    if (!card || list.children.length < 2) return;
    drag = { card, startY: e.clientY, dy: 0 };
    dragged = false;
    try { list.setPointerCapture(e.pointerId); } catch {}   // synthetic pointers have no capture
  });

  list.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.dy = e.clientY - drag.startY;
    if (!dragged) {
      if (Math.abs(drag.dy) < 4) return;       // ignore the jitter of an ordinary click
      dragged = true;
      drag.card.classList.add('drag');
      list.classList.add('dragging');
    }
    drag.card.style.transform = `translateY(${drag.dy}px)`;

    const mid = drag.card.getBoundingClientRect().top + drag.card.offsetHeight / 2;
    const before = [...list.children].find(c => c !== drag.card && mid < c.getBoundingClientRect().top + c.offsetHeight / 2);
    const anchor = before ?? null;
    if (anchor !== drag.card.nextElementSibling) {
      const top = drag.card.getBoundingClientRect().top;
      list.insertBefore(drag.card, anchor);
      // the card just jumped to a new slot: rebase so it stays under the cursor
      drag.startY += drag.card.getBoundingClientRect().top - top + drag.dy;
      drag.dy = e.clientY - drag.startY;
      drag.card.style.transform = `translateY(${drag.dy}px)`;
    }
  });

  const endDrag = e => {
    if (!drag) return;
    const { card } = drag;
    drag = null;
    card.style.transform = '';
    card.classList.remove('drag');
    list.classList.remove('dragging');
    try { if (e?.pointerId != null && list.hasPointerCapture(e.pointerId)) list.releasePointerCapture(e.pointerId); } catch {}
    if (dragged) {
      api.reorder(cardOrder());
      setTimeout(() => { dragged = false; }, 0);   // let this pointerup's click be swallowed first
    }
  };
  list.addEventListener('pointerup', endDrag);
  list.addEventListener('pointercancel', endDrag);

  // ---- hotkey recorder: click the chip, press a combo (needs Ctrl/Alt/Shift), Esc cancels ----
  const hk = $('#hotkey');
  const KEYS = { Space: 'Space', ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right', Home: 'Home', End: 'End',
    PageUp: 'PageUp', PageDown: 'PageDown', Insert: 'Insert', Delete: 'Delete', Backspace: 'Backspace', Tab: 'Tab', Enter: 'Enter' };
  const keyName = c => /^Key[A-Z]$/.test(c) ? c[3] : /^Digit\d$/.test(c) ? c[5] : /^F\d{1,2}$/.test(c) ? c : KEYS[c];
  let recording = false;
  const stopRec = (text, err) => { recording = false; hk.className = err ? 'err' : ''; hk.textContent = text; if (err) setTimeout(() => { hk.className = ''; hk.textContent = hotkey; }, 2000); };
  hk.onclick = () => { if (recording) return; recording = true; hk.className = 'rec'; hk.textContent = T.pressCombo; };
  addEventListener('keydown', async e => {
    if (!recording) { if (e.key === 'Escape') api.hide(); return; }
    e.preventDefault();
    if (e.key === 'Escape') return stopRec(hotkey);
    const key = keyName(e.code);
    if (!key) return; // modifier-only or unsupported key: keep waiting
    const mods = [e.ctrlKey && 'Ctrl', e.altKey && 'Alt', e.shiftKey && 'Shift', e.metaKey && 'Super'].filter(Boolean);
    if (!mods.length) { hk.textContent = T.needMod; return; }
    const acc = [...mods, key].join('+');
    const r = await api.setHotkey(acc);
    r.ok ? stopRec(acc) : stopRec(r.error, true);
  });
</script>
</body>
</html>
